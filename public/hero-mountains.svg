<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 168" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2a4a"/>
      <stop offset="55%" stop-color="#1a4a7a"/>
      <stop offset="100%" stop-color="#2e6fa8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8d4f0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a8d4f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ridge-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2155a0"/>
      <stop offset="100%" stop-color="#1a3f7c"/>
    </linearGradient>
    <linearGradient id="ridge-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#163672"/>
      <stop offset="100%" stop-color="#0e2654"/>
    </linearGradient>
    <linearGradient id="ridge-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1e40"/>
      <stop offset="100%" stop-color="#071630"/>
    </linearGradient>
    <filter id="blur-far" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="blur-mid" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <!-- snow cap mask -->
    <clipPath id="far-clip">
      <path d="M0,168 L0,95 L28,68 L56,85 L84,52 L112,72 L140,38 L168,60 L196,42 L224,65 L252,30 L280,55 L308,18 L336,46 L364,24 L392,50 L420,35 L448,58 L476,22 L504,48 L532,60 L560,38 L588,62 L616,45 L644,68 L672,52 L672,168 Z"/>
    </clipPath>
  </defs>

  <!-- sky background -->
  <rect width="672" height="168" fill="url(#sky)"/>

  <!-- subtle atmospheric glow near horizon -->
  <rect y="70" width="672" height="98" fill="url(#glow)"/>

  <!-- stars (tiny dots) -->
  <g fill="#c8e0f4" opacity="0.55">
    <circle cx="18"  cy="12" r="0.7"/>
    <circle cx="55"  cy="8"  r="0.5"/>
    <circle cx="90"  cy="18" r="0.6"/>
    <circle cx="130" cy="6"  r="0.7"/>
    <circle cx="165" cy="14" r="0.5"/>
    <circle cx="200" cy="5"  r="0.6"/>
    <circle cx="240" cy="20" r="0.5"/>
    <circle cx="275" cy="9"  r="0.7"/>
    <circle cx="310" cy="3"  r="0.5"/>
    <circle cx="355" cy="16" r="0.6"/>
    <circle cx="395" cy="7"  r="0.5"/>
    <circle cx="430" cy="21" r="0.7"/>
    <circle cx="468" cy="4"  r="0.5"/>
    <circle cx="505" cy="13" r="0.6"/>
    <circle cx="545" cy="8"  r="0.5"/>
    <circle cx="580" cy="18" r="0.7"/>
    <circle cx="618" cy="5"  r="0.5"/>
    <circle cx="655" cy="11" r="0.6"/>
    <circle cx="38"  cy="28" r="0.4"/>
    <circle cx="75"  cy="34" r="0.4"/>
    <circle cx="115" cy="25" r="0.4"/>
    <circle cx="152" cy="32" r="0.4"/>
    <circle cx="190" cy="29" r="0.4"/>
    <circle cx="228" cy="37" r="0.4"/>
    <circle cx="265" cy="26" r="0.4"/>
    <circle cx="302" cy="31" r="0.4"/>
    <circle cx="340" cy="28" r="0.4"/>
    <circle cx="378" cy="35" r="0.4"/>
    <circle cx="415" cy="24" r="0.4"/>
    <circle cx="453" cy="33" r="0.4"/>
    <circle cx="490" cy="27" r="0.4"/>
    <circle cx="528" cy="36" r="0.4"/>
    <circle cx="565" cy="23" r="0.4"/>
    <circle cx="602" cy="30" r="0.4"/>
    <circle cx="640" cy="26" r="0.4"/>
  </g>

  <!-- far ridge (blurred, lighter blue) -->
  <path filter="url(#blur-far)" fill="url(#ridge-far)"
    d="M0,168 L0,95 L28,68 L56,85 L84,52 L112,72 L140,38 L168,60 L196,42 L224,65 L252,30 L280,55 L308,18 L336,46 L364,24 L392,50 L420,35 L448,58 L476,22 L504,48 L532,60 L560,38 L588,62 L616,45 L644,68 L672,52 L672,168 Z"/>

  <!-- snow caps on far peaks -->
  <g fill="white" opacity="0.72" clip-path="url(#far-clip)">
    <polygon points="308,18 296,38 320,38"/>
    <polygon points="476,22 465,40 487,40"/>
    <polygon points="252,30 242,48 262,48"/>
    <polygon points="364,24 355,42 373,42"/>
    <polygon points="140,38 130,54 150,54"/>
    <polygon points="560,38 551,54 569,54"/>
  </g>

  <!-- mid ridge -->
  <path filter="url(#blur-mid)" fill="url(#ridge-mid)"
    d="M0,168 L0,115 L40,88 L80,105 L120,74 L160,92 L200,62 L240,80 L280,100 L320,70 L360,90 L400,55 L440,78 L480,95 L520,65 L560,84 L600,72 L640,92 L672,78 L672,168 Z"/>

  <!-- near ridge (darkest, foreground) -->
  <path fill="url(#ridge-near)"
    d="M0,168 L0,135 L50,112 L100,128 L150,105 L200,118 L250,138 L300,115 L350,130 L400,108 L450,122 L500,140 L550,118 L600,132 L650,115 L672,124 L672,168 Z"/>
</svg>
