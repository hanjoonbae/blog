<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 168" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d0d1a"/>
      <stop offset="40%"  stop-color="#1a1040"/>
      <stop offset="75%"  stop-color="#3d1f6b"/>
      <stop offset="100%" stop-color="#c4582a"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="100%" r="55%">
      <stop offset="0%"  stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#c026d3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d0d1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2d1b5e"/>
      <stop offset="100%" stop-color="#1a0f3a"/>
    </linearGradient>
    <linearGradient id="ridge-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a0f3a"/>
      <stop offset="100%" stop-color="#100a26"/>
    </linearGradient>
    <linearGradient id="ridge-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d0820"/>
      <stop offset="100%" stop-color="#06040f"/>
    </linearGradient>
    <filter id="blur-far">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="blur-mid">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="moon-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="672" height="168" fill="url(#sky)"/>

  <!-- horizon glow -->
  <rect width="672" height="168" fill="url(#sun-glow)"/>

  <!-- stars -->
  <g fill="#e0d0ff" opacity="0.7">
    <circle cx="18"  cy="10" r="0.7"/>
    <circle cx="55"  cy="6"  r="0.5"/>
    <circle cx="90"  cy="16" r="0.6"/>
    <circle cx="130" cy="5"  r="0.7"/>
    <circle cx="165" cy="13" r="0.5"/>
    <circle cx="200" cy="4"  r="0.6"/>
    <circle cx="240" cy="18" r="0.5"/>
    <circle cx="275" cy="8"  r="0.7"/>
    <circle cx="310" cy="2"  r="0.5"/>
    <circle cx="430" cy="19" r="0.7"/>
    <circle cx="468" cy="3"  r="0.5"/>
    <circle cx="505" cy="11" r="0.6"/>
    <circle cx="545" cy="7"  r="0.5"/>
    <circle cx="580" cy="17" r="0.7"/>
    <circle cx="618" cy="4"  r="0.5"/>
    <circle cx="655" cy="10" r="0.6"/>
    <circle cx="38"  cy="26" r="0.4"/>
    <circle cx="75"  cy="32" r="0.4"/>
    <circle cx="115" cy="22" r="0.4"/>
    <circle cx="152" cy="30" r="0.4"/>
    <circle cx="190" cy="27" r="0.4"/>
    <circle cx="228" cy="35" r="0.4"/>
    <circle cx="265" cy="24" r="0.4"/>
    <circle cx="490" cy="25" r="0.4"/>
    <circle cx="528" cy="34" r="0.4"/>
    <circle cx="565" cy="21" r="0.4"/>
    <circle cx="602" cy="28" r="0.4"/>
    <circle cx="640" cy="24" r="0.4"/>
  </g>

  <!-- moon -->
  <g filter="url(#moon-glow)">
    <circle cx="530" cy="30" r="10" fill="#fffbe8" opacity="0.92"/>
    <circle cx="536" cy="27" r="9"  fill="#2d1b5e"/>
  </g>

  <!-- far ridge -->
  <path filter="url(#blur-far)" fill="url(#ridge-far)"
    d="M0,168 L0,95 L28,68 L56,85 L84,52 L112,72 L140,38 L168,60 L196,42 L224,65 L252,30 L280,55 L308,18 L336,46 L364,24 L392,50 L420,35 L448,58 L476,22 L504,48 L532,60 L560,38 L588,62 L616,45 L644,68 L672,52 L672,168 Z"/>

  <!-- snow caps -->
  <g fill="white" opacity="0.55">
    <polygon points="308,18 297,40 319,40"/>
    <polygon points="476,22 466,42 486,42"/>
    <polygon points="252,30 243,50 261,50"/>
    <polygon points="364,24 356,44 372,44"/>
    <polygon points="140,38 131,56 149,56"/>
    <polygon points="560,38 552,55 568,55"/>
  </g>

  <!-- mid ridge -->
  <path filter="url(#blur-mid)" fill="url(#ridge-mid)"
    d="M0,168 L0,115 L40,88 L80,105 L120,74 L160,92 L200,62 L240,80 L280,100 L320,70 L360,90 L400,55 L440,78 L480,95 L520,65 L560,84 L600,72 L640,92 L672,78 L672,168 Z"/>

  <!-- near ridge -->
  <path fill="url(#ridge-near)"
    d="M0,168 L0,135 L50,112 L100,128 L150,105 L200,118 L250,138 L300,115 L350,130 L400,108 L450,122 L500,140 L550,118 L600,132 L650,115 L672,124 L672,168 Z"/>
</svg>
